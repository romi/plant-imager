# =============================================================================
# Virtual Scan (LPY + Blender) configuration
# =============================================================================
#
# This file defines a complete end‑to‑end pipeline for generating a *virtual*
# plant scan using an LPY model and Blender rendering. The pipeline is built
# from a set of Luigi tasks (see `src/plantimager/tasks/*.py`), each of which
# consumes the output of the previous step.
#
# The high‑level flow is:
#
#  1. VirtualPlant – Generates a 3‑D plant model from an LPY file.
#  2. ScanPath – Defines the camera trajectory used to scan the virtual plant.
#  3. VirtualScan – Renders the plant from the viewpoints generated by
#     `ScanPath` using Blender. It can optionally load a scene, apply an HDRI
#     background, color‑palette the plant, and generate ground‑truth
#     segmentation masks.
#
# Each section below contains the task‑specific parameters with defaults
# (comments) matching the implementation in the corresponding Python module.
# Adjust the values as needed for your dataset, desired rendering realism, or
# hardware constraints.
# =============================================================================

[VirtualPlant]
# The LPY file identifier to use for plant generation
# Should exist in the LpyFileset
lpy_file_id = "arabidopsis_notex"  # Default: "arabidopsis_notex"

[VirtualPlant.lpy_globals]
# Global LPY variables used by lpy.Lsystem() method
# These parameters control the stochastic generation of the virtual plant
# Default: {"SEED": random.randint(0, 100000)}
# ---
# Whether to generate branches (True/False)
# Controls if lateral branches are produced during plant development
BRANCHON = false  # Default: false
# Mean number of days for plant development
# The actual number of days is randomly drawn from a Gaussian distribution
MEAN_NB_DAYS = 40  # Default: 40
# Standard deviation for the number of days
# Used to create variation in plant development time
STDEV_NB_DAYS = 5  # Default: 5
# Initial insertion angle of branches (in degrees)
# Controls the angle at which lateral branches emerge from the main stem
BETA = 51  # Default: 51
# Average length of an internode (in cm)
# Controls the spacing between nodes on the stem
INTERNODE_LENGTH = 1.3  # Default: 1.3
# Diameter of the stem (in cm)
# Controls the thickness of the plant stem
STEM_DIAMETER = 0.25  # Default: 0.25

[PaletteFileset]
# The scan ID to use for accessing the palette fileset
scan_id = "vscan_data"  # Default: "vscan_data"

[HdriFileset]
# The scan ID to use for accessing the HDRI fileset
scan_id = "vscan_data"  # Default: "vscan_data"

[LpyFileset]
# The scan ID to use for accessing the LPY fileset
scan_id = "vscan_data"  # Default: "vscan_data"

# -----------------------------------------------------------------------------

[ScanPath]
# The class name for the scanning path
class_name = "Circle"  # Default: "Circle"

[ScanPath.kwargs]
# Center X coordinate in mm
center_x = 0  # Default: 0
# Center Y coordinate in mm
center_y = 0  # Default: 0
# Z coordinate in mm
z = 32  # Default: 32
# Tilt angle in degrees
tilt = 3  # Default: 3
# Radius of the scanning circle in mm
radius = 40  # Default: 40
# Number of points in the scanning path
n_points = 36  # Default: 36

# -----------------------------------------------------------------------------

[VirtualScan]
# Whether to load the scene file
load_scene = false  # Default: false
# The name of the scene file to load, if any
scene_file_id = ""  # Default: ""
# Whether to use a color palette to render the virtual plant
use_palette = true  # Default: true
# Whether to use an HDRI file for the background
use_hdri = true  # Default: true
# The Fileset that contains the virtual plant OBJ file to render and capture
obj_fileset = "VirtualPlant"  # Default: "VirtualPlant"
# The Fileset that contains the HDRI files to use as background
hdri_fileset = "HdriFileset"  # Default: "HdriFileset"
# The Fileset that contain the scenes to use
scene_fileset = "SceneFileset"  # Default: "SceneFileset"
# The Fileset that contains the color palette to use to render the virtual plant
palette_fileset = "PaletteFileset"  # Default: "PaletteFileset"
# If True, create the mask image for defined ground truth classes in virtual plant model
render_ground_truth = true  # Default: true
# Whether the virtual plant should be colorized in Blender
colorize = true  # Default: true

[VirtualScan.scanner]
# Width of the rendered images in pixels
width = 1440  # Default: 1440
# Height of the rendered images in pixels
height = 1080  # Default: 1080
# Focal length of the camera in mm
focal = 16  # Default: 16
# Whether to use flash during rendering
flash = false  # Default: false
# Port number for the rendering service
port = 9001  # Default: 9001
# Whether to add leaf displacement for realistic rendering
add_leaf_displacement = true  # Default: true
